<script>
function romanToInteger(str) {
let res = 0;
let map={I:1, V:5, X:10, L:50, C:100, D:500, M:1000}
for(let i=0;i<str.length;i++){
 let curr=map[str[i]];
 let next=map[str[i+1]];
 if (next && curr < next){
    res=res-curr;
 }  else {
    res=res+curr;
 }
}
return res;
}
  console.log(romanToInteger('IX'));  
  console.log(romanToInteger('XII'));
</script>
