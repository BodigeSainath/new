<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1 id="myTitle"> lets learn document object</h1>
<h2>this is h2_1</h2>
<h2>this is h2_2</h2>
<h3>this is h3</h3>
    <script>
    document.write("Hello javascript!");
    document.getElementById("myTitle").style.color="red";

    let all_h2 = document.querySelectorAll("h2");
    console.log(all_h2);

    all_h2[0].style.color ="blue";
    all_h2[1].style.color ="yellow";

    </script>
</body>
</html>
