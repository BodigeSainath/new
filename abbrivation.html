<script>
    let string="Rabindra Nath Tagore";
    words=string.split(" ");
    let result="";
    for(let word of words){
        if(word != words[words.length-1]){
        result=result+(word[0].toUpperCase()+". ");
        }
        else{
            result+=word[0].toUpperCase()+word.slice(1);
        }
    }
    console.log(result);
</script>
